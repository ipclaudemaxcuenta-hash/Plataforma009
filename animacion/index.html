<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escena animada</title>
<style>
  :root { --bg: #0b0910; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; overflow: hidden; }
  /* Contenedor con la proporción exacta de la imagen: la imagen no se recorta ni se altera */
  .scene { position: relative; width: min(100vw, calc(100vh * 2000 / 1124)); aspect-ratio: 2000 / 1124; overflow: hidden; }
  .scene > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* Halo de la luna (pulso suave) */
  .moon { left: 46.2%; top: 24%; width: 30%; aspect-ratio: 1; inset: auto; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,240,250,0) 34%, rgba(255,235,250,.22) 38%, rgba(220,200,255,.08) 55%, transparent 70%);
    mix-blend-mode: screen; animation: halo 6s ease-in-out infinite; }
  @keyframes halo { 50% { opacity: .35; transform: translate(-50%, -50%) scale(1.04); } }

  /* Luces violetas que titilan */
  .glow { inset: auto; width: 14%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(255,230,255,.55), rgba(190,90,230,.35) 30%, transparent 70%);
    mix-blend-mode: screen; animation: flicker 3.2s ease-in-out infinite; }
  .g1 { left: 7.2%; top: 86%; }
  .g2 { left: 79.8%; top: 86%; animation-delay: -1.4s; animation-duration: 3.8s; }
  @keyframes flicker { 0%,100% { opacity: .55; transform: translate(-50%,-50%) scale(.92); }
    40% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } 55% { opacity: .7; } 70% { opacity: .95; } }

  /* Niebla que se desplaza (dos capas en sentidos opuestos) */
  .fog { top: auto; height: 38%; width: 200%; mix-blend-mode: screen; opacity: .5;
    background:
      radial-gradient(ellipse 18% 40% at 10% 70%, rgba(220,210,235,.35), transparent 70%),
      radial-gradient(ellipse 22% 35% at 35% 80%, rgba(200,190,225,.3), transparent 70%),
      radial-gradient(ellipse 16% 45% at 60% 75%, rgba(225,215,240,.3), transparent 70%),
      radial-gradient(ellipse 20% 38% at 85% 82%, rgba(205,195,230,.3), transparent 70%);
    animation: drift 40s linear infinite; }
  .fog.b { opacity: .35; height: 30%; animation-duration: 60s; animation-direction: reverse; filter: blur(6px); }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* Nubes muy tenues que pasan frente al cielo */
  .clouds { height: 55%; width: 200%; opacity: .25; mix-blend-mode: screen; filter: blur(10px);
    background:
      radial-gradient(ellipse 14% 22% at 20% 30%, rgba(210,200,230,.5), transparent 70%),
      radial-gradient(ellipse 18% 18% at 55% 50%, rgba(200,190,220,.4), transparent 70%),
      radial-gradient(ellipse 12% 20% at 80% 25%, rgba(215,205,235,.45), transparent 70%);
    animation: drift 90s linear infinite; }

  .anim { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }

  @media (prefers-reduced-motion: reduce) { .layer { animation: none !important; } canvas, .anim { display: none; } }
</style>
</head>
<body>
  <div class="scene">
    <img src="escena.jpg" alt="Jack y Sally bajo la luna llena junto a la reja del cementerio, con Zero y murciélagos">
<svg class="anim" viewBox="0 0 2000 1124" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <mask id="mHair"><g fill="#fff" filter="url(#soft)"><path d="M1300 300 C1360 320 1420 420 1430 520 C1440 600 1420 650 1380 650 L1330 560 L1310 380 Z"/><path d="M1180 240 C1240 230 1280 290 1290 360 L1300 520 L1260 600 C1250 520 1260 420 1220 340 Z"/></g></mask>
    <mask id="mCloth"><g fill="#fff" filter="url(#soft)"><path d="M1110 270 C1150 230 1210 230 1240 260 L1250 420 C1220 470 1170 480 1130 440 C1110 380 1100 320 1110 270 Z"/></g></mask>
    <mask id="mEars"><g fill="#fff" filter="url(#soft)"><path d="M440 615 C470 610 520 650 530 680 L505 700 C480 680 450 650 440 615 Z"/><path d="M515 670 C550 660 590 665 600 690 L560 705 Z"/></g></mask>
    <mask id="mBats"><g fill="#fff" filter="url(#soft)"><ellipse cx="470" cy="180" rx="70" ry="45"/><ellipse cx="330" cy="235" rx="70" ry="45"/><ellipse cx="415" cy="390" rx="70" ry="45"/><ellipse cx="600" cy="100" rx="70" ry="45"/><ellipse cx="650" cy="75" rx="70" ry="45"/><ellipse cx="705" cy="120" rx="70" ry="45"/><ellipse cx="560" cy="330" rx="70" ry="45"/><ellipse cx="660" cy="470" rx="70" ry="45"/><ellipse cx="590" cy="440" rx="70" ry="45"/><ellipse cx="790" cy="500" rx="70" ry="45"/><ellipse cx="900" cy="545" rx="70" ry="45"/><ellipse cx="1060" cy="530" rx="70" ry="45"/><ellipse cx="1150" cy="490" rx="70" ry="45"/><ellipse cx="1240" cy="150" rx="70" ry="45"/><ellipse cx="1290" cy="110" rx="70" ry="45"/><ellipse cx="1450" cy="150" rx="70" ry="45"/><ellipse cx="1210" cy="15" rx="70" ry="45"/><ellipse cx="1600" cy="190" rx="70" ry="45"/><ellipse cx="1780" cy="225" rx="70" ry="45"/><ellipse cx="1660" cy="255" rx="70" ry="45"/><ellipse cx="1820" cy="280" rx="70" ry="45"/><ellipse cx="1640" cy="370" rx="70" ry="45"/><ellipse cx="1700" cy="410" rx="70" ry="45"/><ellipse cx="1700" cy="475" rx="70" ry="45"/><ellipse cx="1890" cy="265" rx="70" ry="45"/><ellipse cx="530" cy="630" rx="70" ry="45"/><ellipse cx="380" cy="660" rx="70" ry="45"/><ellipse cx="520" cy="465" rx="70" ry="45"/><ellipse cx="830" cy="590" rx="70" ry="45"/><ellipse cx="1440" cy="90" rx="70" ry="45"/></g></mask>
    <filter id="fHair" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="3" result="n">
        <animate attributeName="baseFrequency" dur="7s" values="0.012 0.03;0.016 0.026;0.012 0.03" repeatCount="indefinite"/></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" dur="4s" values="8;22;8" repeatCount="indefinite"/></feDisplacementMap>
    </filter>
    <filter id="fCloth" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="2" seed="8" result="n">
        <animate attributeName="baseFrequency" dur="5s" values="0.02 0.05;0.026 0.04;0.02 0.05" repeatCount="indefinite"/></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" dur="3.3s" values="6;18;6" repeatCount="indefinite"/></feDisplacementMap>
    </filter>
    <filter id="fEars" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" dur="1.6s" values="0;18;0;12;0" repeatCount="indefinite"/></feDisplacementMap>
    </filter>
    <filter id="fBats" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="1" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="B" yChannelSelector="G">
        <animate attributeName="scale" dur="0.45s" values="-14;14;-14" repeatCount="indefinite"/></feDisplacementMap>
    </filter>
  </defs>
  <g mask="url(#mBats)"><image href="escena.jpg" width="2000" height="1124" filter="url(#fBats)"/></g>
  <g mask="url(#mHair)"><image href="escena.jpg" width="2000" height="1124" filter="url(#fHair)"/></g>
  <g mask="url(#mCloth)"><image href="escena.jpg" width="2000" height="1124" filter="url(#fCloth)"/></g>
  <g mask="url(#mEars)"><image href="escena.jpg" width="2000" height="1124" filter="url(#fEars)"/></g>
</svg>
    <div class="layer clouds"></div>
    <div class="layer moon"></div>
    <div class="layer fog"></div>
    <div class="layer fog b"></div>
    <div class="layer glow g1"></div>
    <div class="layer glow g2"></div>
    <canvas id="motes"></canvas>
  </div>
<script>
  // Partículas violetas flotando (luciérnagas) sobre la imagen, sin tocarla
  const c = document.getElementById('motes'), x = c.getContext('2d');
  let W, H, P = [];
  const fit = () => { const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
    W = c.width = r.width * d; H = c.height = r.height * d; };
  const spawn = () => ({ x: Math.random() * W, y: H * (.55 + Math.random() * .45),
    r: (0.6 + Math.random() * 1.8) * (W / 1000), vy: -(0.1 + Math.random() * 0.35) * (W / 1000),
    ph: Math.random() * 6.28, life: 0, max: 300 + Math.random() * 400 });
  fit(); addEventListener('resize', fit);
  for (let i = 0; i < 60; i++) { const p = spawn(); p.life = Math.random() * p.max; P.push(p); }
  (function tick() {
    x.clearRect(0, 0, W, H);
    for (let i = 0; i < P.length; i++) {
      const p = P[i]; p.life++; p.ph += .03;
      p.y += p.vy; p.x += Math.sin(p.ph) * .3 * (W / 1000);
      const a = Math.sin(Math.PI * p.life / p.max) * (.6 + .4 * Math.sin(p.ph * 2));
      const g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      g.addColorStop(0, `rgba(245,210,255,${a})`); g.addColorStop(1, 'rgba(180,80,230,0)');
      x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, p.r * 4, 0, 6.28); x.fill();
      if (p.life > p.max) P[i] = spawn();
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
