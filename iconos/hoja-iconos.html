 // Barra inferior
 Home:`<rect class="p" x="66" y="22" width="9" height="20" rx="2.5" style="fill:var(--h0)"/><path d="M50 17 86 47H78V76a6 6 0 0 1-6 6H28a6 6 0 0 1-6-6V47H14Z" style="fill:var(--h0);stroke:var(--h0)" stroke-width="3" stroke-linejoin="round"/>

 ip:['#8C96FF','#4450E0'],'referencia-laboral':['#B8E44C','#62A812'],'busqueda-personas':['#62D4FF','#0093DD'],'ficha-id':['#FFFFFF','#E6EAF1','#2E6BF0'],
 splaft:['#FFFFFF','#F3E7E9','#E0263A'],crediticio:['#44AEC0','#0A5D73',,'#5FD0E0'],'credit-pro':['#FF72B4','#CF1676'],icar:['#FFD84A','#F0A800'],

// Squircle continuo (superelipse n=5) como los iconos de iOS/macOS
const sq=(x,y,w)=>{let p='';const n=5,c=x+w/2,d=y+w/2,r=w/2;for(let i=0;i<=72;i++){const t=i/72*2*Math.PI,ct=Math.cos(t),st2=Math.sin(t);
 const px=c+r*Math.sign(ct)*Math.pow(Math.abs(ct),2/n),py=d+r*Math.sign(st2)*Math.pow(Math.abs(st2),2/n);p+=(i?'L':'M')+px.toFixed(2)+' '+py.toFixed(2)}return p+'Z'};
let n=0;
function tile(key,shape,colors,glyph,special){const id='i'+(n++);const [c1,c2,g]=colors;const P=g||'#fff',cut=g?c1:c2;
 const home=key==='Home';
 let clip,frame,inset=0;
 if(shape==='ios'){clip=sq(0,0,100)}
 else if(shape==='mac'){inset=8;clip=sq(8,8,84)}
 else{clip=null}
 const bgPath=shape==='circle'?`<circle cx="50" cy="50" r="46"/>`:`<path d="${clip}"/>`;
 const fill=special==='jaina'?`url(#${id}j)`:`url(#${id}g)`;
 const sc=shape==='mac'?'translate(50 50) scale(.84) translate(-50 -50)':(shape==='circle'?'translate(50 50) scale(.62) translate(-50 -50)':'');
 const hv=home?`--h0:#FF8A00;--h1:#FFA21A;--h2:#FFB83D;--h3:#FFD271;--h4:#FFF1BC;`:'';
 return `<svg class="t" viewBox="0 0 100 100" style="--p:${special==='jaina'?'#fff':P};--cut:${cut};--so:.5;${hv}">
 <defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>
 <radialGradient id="${id}j" cx=".5" cy=".56" r=".55"><stop offset="0" stop-color="#0d5a2c"/><stop offset=".3" stop-color="#138a42"/><stop offset=".64" stop-color="#25D366"/><stop offset=".85" stop-color="#3be37a"/><stop offset="1" stop-color="#1fb855"/></radialGradient>
 <linearGradient id="${id}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <clipPath id="${id}c">${bgPath}</clipPath>
 <filter id="${id}s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="${shape==='mac'?3:2}" stdDeviation="${shape==='mac'?2.6:1.8}" flood-opacity="${shape==='mac'?.32:.22}"/></filter></defs>
 <g filter="url(#${id}s)" fill="${fill}">${bgPath}</g>
 <g clip-path="url(#${id}c)"><g class="n2" transform="${sc}" style="filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))">${glyph}</g></g>
 <g fill="url(#${id}h)">${bgPath}</g>
 <g fill="none" stroke="#fff" stroke-opacity=".45" stroke-width=".7">${bgPath}</g></svg>`}
const css=document.createElement('style');css.textContent=`.n2 .p{fill:var(--p)}.n2 .s{fill:var(--p);opacity:var(--so)}.n2 .c{fill:var(--cut)}.n2 .ps{fill:none;stroke:var(--p);stroke-linecap:round;stroke-linejoin:round}.n2 .ss{fill:none;stroke:var(--p);opacity:var(--so);stroke-linecap:round;stroke-linejoin:round}.n2 .cs{fill:none;stroke:var(--cut);stroke-linecap:round;stroke-linejoin:round}`;document.head.appendChild(css);
