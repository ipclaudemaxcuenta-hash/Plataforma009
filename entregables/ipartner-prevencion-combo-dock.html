<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPartner · Prevención · Consulta Combo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- Marco y escritorio ---- */
  --marco:#1B1B1E;
  --fondo-1:#F7DACE;   /* durazno  */
  --fondo-2:#F7D0DD;   /* rosa     */
  --fondo-3:#F6CBE9;   /* fucsia   */
  --fondo-4:#E2B9DB;   /* lavanda  */
  --fondo-5:#E3D7E1;   /* gris liláceo */

  /* ---- Ventana ---- */
  --ventana:#F6F6F6;
  --linea:#E6E2E6;
  --campo:#FFFFFF;
  --campo-borde:#E3DCE6;
  --caret-bg:#F2F5F9;

  /* ---- Marca iPartner ---- */
  --morado-900:#17122B;
  --morado-800:#3A2781;
  --morado-700:#4A267F;
  --morado-600:#85207B;
  --vino:#562854;        /* botón Buscar */
  --vino-alto:#6B3369;
  --texto:#552653;
  --texto-2:#5B5B5F;
  --texto-3:#8A8A8E;
  --naranja:#EF801C;
  --naranja-dock:#E3A153;
  --celeste:#0797A9;

  /* ---- Acentos de módulo (dock) ---- */
  --m-home-a:#E3A153;    --m-home-b:#D98D41;
  --m-prev-a:#946ABC;    --m-prev-b:#7E50A5;
  --m-proc-a:#B482C7;    --m-proc-b:#9D67B5;
  --m-dash-a:#7B6EC5;    --m-dash-b:#6458B1;
  --m-rep-a:#6CB59F;     --m-rep-b:#5AA38D;
  --m-prog-a:#92CBD9;    --m-prog-b:#7EB4C5;
  --dni-a:#73BED9;       --dni-b:#61AED0;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  font-size:14px;
  color:var(--texto-2);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 20px;
  background:
    radial-gradient(130% 110% at 0% 0%,   var(--fondo-1) 0%, transparent 55%),
    radial-gradient(120% 120% at 100% 0%, var(--fondo-3) 0%, transparent 60%),
    radial-gradient(130% 120% at 0% 100%, var(--fondo-4) 0%, transparent 60%),
    linear-gradient(145deg, var(--fondo-2) 0%, var(--fondo-4) 55%, var(--fondo-5) 100%);
  background-attachment:fixed;
}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--morado-700);outline-offset:2px}
[hidden]{display:none !important}

/* ============ ESCENA: iPad + elementos flotantes ============ */
.escena{position:relative;width:100%;max-width:1300px}

/* Botones flotantes sobre el marco (chat + perfil) */
.flotantes{
  position:absolute;top:-16px;right:6px;z-index:40;
  display:flex;align-items:center;gap:14px;
}
.burbuja{
  position:relative;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:3px solid rgba(255,255,255,.82);
  box-shadow:0 6px 18px rgba(60,20,60,.22);
  transition:transform .18s ease, box-shadow .18s ease;
}
.burbuja:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(60,20,60,.28)}
.burbuja.chat{background:linear-gradient(160deg,#6FB8A1,#57A08A)}
.burbuja.perfil{background:linear-gradient(160deg,#9B3C95,#883083)}
.burbuja .punto{
  position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;
  background:var(--naranja);border:2.5px solid #fff;
}

/* Marco del iPad */
.ipad{
  position:relative;
  background:var(--marco);
  border-radius:40px;
  padding:22px;
  box-shadow:
    0 2px 0 rgba(255,255,255,.14) inset,
    0 30px 70px rgba(40,10,45,.34),
    0 6px 18px rgba(40,10,45,.18);
}
.pantalla{
  position:relative;
  background:var(--ventana);
  border-radius:22px;
  overflow:hidden;
  height:min(760px, calc(100vh - 150px));
  min-height:520px;
  display:flex;
  flex-direction:column;
}

/* ============ VENTANA / MÓDULO ============ */
.modulo{
  display:flex;flex-direction:column;
  flex:1 1 auto;min-height:0;
  background:var(--ventana);
}

/* Tirador superior */
.grabber{
  flex:0 0 auto;display:flex;justify-content:center;padding:10px 0 2px;
}
.grabber span{width:38px;height:4px;border-radius:4px;background:#DED7DE}

/* --- Encabezado --- */
.cabecera{
  flex:0 0 auto;
  display:flex;align-items:flex-start;gap:14px;
  padding:10px 30px 18px;
}
.ficha{
  width:38px;height:38px;flex:0 0 auto;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--m-prev-a),var(--m-prev-b));
  box-shadow:0 4px 10px rgba(90,40,110,.26);
  transition:background .25s ease;
}
.titulos{flex:1 1 auto;min-width:0;line-height:1.3}
.titulos h1{
  font-size:19px;font-weight:500;color:var(--texto);letter-spacing:.1px;
}
.titulos p{font-size:14px;color:var(--texto-2);margin-top:2px}
.cerrar{
  width:34px;height:34px;flex:0 0 auto;border-radius:50%;
  background:#EAE8EA;display:flex;align-items:center;justify-content:center;
  color:var(--texto);transition:background .18s ease;
}
.cerrar:hover{background:#DFDADF}

.separador{height:1px;background:var(--linea);margin:0 30px;flex:0 0 auto}

/* --- Fila de búsqueda --- */
.fila-busqueda{
  flex:0 0 auto;
  display:flex;align-items:flex-end;gap:14px;
  padding:20px 30px;flex-wrap:wrap;
}
.tile-doc{
  width:40px;height:40px;flex:0 0 auto;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--dni-a),var(--dni-b));
  box-shadow:0 4px 10px rgba(40,120,160,.26);
}
.campo-doc{flex:0 1 420px;min-width:220px}
.campo-doc > label{
  display:block;font-size:12px;color:var(--texto-3);
  margin:0 0 5px 12px;
}
.caja-doc{
  display:flex;align-items:center;gap:10px;
  height:42px;padding:0 14px;
  background:var(--campo);
  border:1px solid var(--campo-borde);
  border-radius:9px;
  transition:border-color .18s ease, box-shadow .18s ease;
}
.caja-doc:focus-within{
  border-color:var(--m-prev-b);
  box-shadow:0 0 0 3px rgba(126,80,165,.13);
}
.caja-doc svg{flex:0 0 auto;color:var(--texto)}
.caja-doc input{
  flex:1 1 auto;min-width:0;border:0;background:none;
  font-size:15px;color:#2E2A30;
}
.caja-doc input::placeholder{color:#B4AEB6}
.btn-buscar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:9px;
  height:42px;padding:0 24px;border-radius:9px;
  background:var(--vino);color:#fff;font-size:15px;
  box-shadow:0 4px 12px rgba(86,40,84,.3);
  transition:background .18s ease, transform .12s ease;
}
.btn-buscar:hover{background:var(--vino-alto)}
.btn-buscar:active{transform:translateY(1px)}

/* --- Centro de costo (campo con etiqueta en muesca) --- */
.fila-centro{flex:0 0 auto;padding:18px 30px 6px}
.combo{position:relative;width:340px;max-width:100%}
.combo-caja{
  display:flex;align-items:stretch;
  height:50px;
  border:1px solid #CFD9E6;border-radius:7px;
  background:var(--campo);overflow:hidden;
  transition:border-color .18s ease, box-shadow .18s ease;
}
.combo.abierto .combo-caja,
.combo-caja:focus-within{
  border-color:var(--morado-800);
  box-shadow:0 0 0 3px rgba(58,39,129,.11);
}
.combo-caja input{
  flex:1 1 auto;min-width:0;border:0;background:none;
  padding:0 14px;font-size:16px;color:#2E2A30;
}
.combo-caja input::placeholder{color:#8C93A3}
.combo-caret{
  flex:0 0 46px;display:flex;align-items:center;justify-content:center;
  background:var(--caret-bg);border-left:1px solid #E4EAF2;color:#5C6472;
}
.combo-caret svg{transition:transform .22s ease}
.combo.abierto .combo-caret svg{transform:rotate(180deg)}
.combo > label{
  position:absolute;top:-8px;left:11px;
  padding:0 5px;background:var(--ventana);
  font-size:12px;color:var(--morado-800);
  pointer-events:none;
}
.combo-lista{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;
  background:#fff;border:1px solid #E1E6EF;border-radius:9px;
  box-shadow:0 14px 30px rgba(40,20,60,.16);
  max-height:230px;overflow-y:auto;padding:5px;
}
.combo-lista button{
  display:block;width:100%;text-align:left;
  padding:10px 12px;border-radius:6px;font-size:14px;color:#3A3540;
}
.combo-lista button:hover,.combo-lista button.marcado{background:#F3EEF8;color:var(--morado-700)}
.combo-lista .sin-resultado{padding:14px 12px;font-size:13px;color:var(--texto-3);text-align:center}

/* --- Cuerpo con scroll interno --- */
.cuerpo{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  padding:0 30px;
  display:flex;flex-direction:column;
}
.cuerpo::-webkit-scrollbar{width:9px}
.cuerpo::-webkit-scrollbar-thumb{background:#DCD5DD;border-radius:9px}

.vacio{
  flex:1 1 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:7px;padding:50px 16px;
}
.vacio h2{font-size:17px;font-weight:500;color:var(--texto)}
.vacio p{font-size:13.5px;color:var(--texto-3)}

/* --- Resultado --- */
.resultado{padding:14px 0 26px}
.tarjeta{
  background:#fff;border:1px solid #EDE7EF;border-radius:13px;
  padding:20px 22px;box-shadow:0 2px 10px rgba(60,30,70,.06);
}
.tarjeta-top{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--linea);
}
.avatar-res{
  width:44px;height:44px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--m-prev-a),var(--m-prev-b));color:#fff;
}
.tarjeta-top .quien{flex:1 1 220px;min-width:0}
.tarjeta-top .quien b{display:block;font-size:15px;font-weight:600;color:#2E2A30}
.tarjeta-top .quien span{font-size:12.5px;color:var(--texto-3)}
.chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:500;
  background:#EAF6EF;color:#1F7A4D;
}
.chip i{width:7px;height:7px;border-radius:50%;background:#2E9B63}
.datos{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-top:18px;
}
.datos div{background:#FAF8FB;border:1px solid #F0EAF2;border-radius:9px;padding:10px 13px}
.datos small{display:block;font-size:11px;color:var(--texto-3);margin-bottom:3px}
.datos span{font-size:13.5px;color:#2E2A30}
.nota-demo{
  margin-top:14px;font-size:11.5px;color:var(--texto-3);
  text-align:center;font-style:italic;
}

/* --- Consultas recientes --- */
.recientes{flex:0 0 auto;border-top:1px solid var(--linea);margin:0 30px;padding:16px 0 86px}
.recientes-tit{
  display:flex;align-items:center;gap:10px;
  font-size:14px;color:var(--texto);
}
.recientes-hint{text-align:center;font-size:13px;color:var(--texto-3);padding:24px 10px 4px}
.lista-rec{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:7px}
.lista-rec li{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:#fff;border:1px solid #EDE7EF;border-radius:9px;padding:10px 14px;font-size:13px;
}
.lista-rec b{font-weight:600;color:#2E2A30}
.lista-rec .cc{color:var(--texto-3);flex:1 1 auto}
.lista-rec time{color:var(--texto-3);font-size:12px}

/* ============ DOCK ============ */
.dock-zona{
  position:absolute;left:0;right:0;bottom:16px;z-index:35;
  display:flex;justify-content:center;pointer-events:none;
}
.dock{
  pointer-events:auto;
  display:flex;align-items:center;gap:10px;
  padding:11px 13px;border-radius:22px;
  background:rgba(252,251,252,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 12px 34px rgba(50,20,55,.2);
}
.app{
  position:relative;width:44px;height:44px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 10px rgba(60,30,70,.22);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.app:hover{transform:translateY(-7px) scale(1.06)}
.app .activo-punto{
  position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--naranja);
  opacity:0;transition:opacity .2s ease;
}
.app[aria-current="true"] .activo-punto{opacity:1}
.app[data-app="home"]{background:linear-gradient(160deg,var(--m-home-a),var(--m-home-b))}
.app[data-app="prevencion"]{background:linear-gradient(160deg,var(--m-prev-a),var(--m-prev-b))}
.app[data-app="procesos"]{background:linear-gradient(160deg,var(--m-proc-a),var(--m-proc-b))}
.app[data-app="dashboard"]{background:linear-gradient(160deg,var(--m-dash-a),var(--m-dash-b))}
.app[data-app="reportes"]{background:linear-gradient(160deg,var(--m-rep-a),var(--m-rep-b))}
.app[data-app="progresion"]{background:linear-gradient(160deg,var(--m-prog-a),var(--m-prog-b))}

/* Escritorio (cuando se cierra la ventana) */
.escritorio{
  flex:1 1 auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;text-align:center;padding:40px;
  background:
    radial-gradient(90% 80% at 50% 0%, #FBF5FA 0%, transparent 70%),
    var(--ventana);
}
.escritorio .wordmark{font-size:38px;font-weight:600;letter-spacing:-.5px}
.escritorio .wordmark .n{color:var(--naranja)}
.escritorio .wordmark .m{color:#89037B}
.escritorio .eslogan{
  font-size:11px;letter-spacing:3px;font-weight:500;color:var(--morado-700);
}
.escritorio .eslogan .f{color:var(--celeste)}
.escritorio p{font-size:13.5px;color:var(--texto-3);margin-top:6px}

/* Aviso flotante */
.aviso{
  position:absolute;left:50%;bottom:122px;transform:translate(-50%,10px);
  background:#2F2A33;color:#fff;font-size:13px;
  padding:11px 20px;border-radius:9px;
  opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  z-index:45;box-shadow:0 10px 24px rgba(0,0,0,.26);
}
.aviso.ver{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .ipad{border-radius:28px;padding:14px}
  .pantalla{border-radius:16px;height:min(700px, calc(100vh - 110px))}
  .cabecera,.fila-busqueda,.fila-centro,.cuerpo{padding-left:18px;padding-right:18px}
  .separador,.recientes{margin-left:18px;margin-right:18px}
  .combo{width:100%}
  .campo-doc{flex:1 1 100%}
  .btn-buscar{flex:1 1 100%;justify-content:center}
  .dock{gap:6px;padding:9px}
  .app{width:40px;height:40px}
  .flotantes{top:-12px;right:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

(function(){var L=document.getElementById('lienzo'),W=1920,H=1080;
function encajar(){var w=innerWidth,h=innerHeight,k=Math.min(w/W,h/H);L.style.transform='translate('+(w-W*k)/2+'px,'+(h-H*k)/2+'px) scale('+k+')';}
encajar();addEventListener('resize',encajar);})();
</script>
<script>
(function(){
  'use strict';

  /* ---------------- Datos de demostración ---------------- */
  var CENTROS = [
    'ADMINISTRACIÓN Y FINANZAS',
    'ALMACÉN CENTRAL',
    'CADENA DE SUMINISTRO',
    'GESTIÓN HUMANA — LIMA',
    'GESTIÓN HUMANA — PROVINCIAS',
    'LEGAL Y CUMPLIMIENTO',
    'OPERACIONES — PLANTA NORTE',
    'OPERACIONES — PLANTA SUR',
    'RECLUTAMIENTO MASIVO',
    'SEGURIDAD PATRIMONIAL',
    'TECNOLOGÍA DE LA INFORMACIÓN'
  ];

  var MODULOS = {
    home:       { titulo:'Home',       sub:'Panel principal',        a:'--m-home-a', b:'--m-home-b' },
    prevencion: { titulo:'Prevención', sub:'Consulta Combo',         a:'--m-prev-a', b:'--m-prev-b' },
    procesos:   { titulo:'Procesos',   sub:'Consultas en proceso',   a:'--m-proc-a', b:'--m-proc-b' },
    dashboard:  { titulo:'Dashboard',  sub:'Consumo de paquete',     a:'--m-dash-a', b:'--m-dash-b' },
    reportes:   { titulo:'Reportes',   sub:'Resultados del periodo', a:'--m-rep-a',  b:'--m-rep-b'  },
    progresion: { titulo:'Progresión', sub:'Tendencia de consumo',   a:'--m-prog-a', b:'--m-prog-b' }
  };

  var $ = function(id){ return document.getElementById(id); };

  var combo    = $('combo'),
      cc       = $('cc'),
      ccLista  = $('ccLista'),
      ccCaret  = $('ccCaret'),
      doc      = $('doc'),
      cuerpo   = $('cuerpo'),
      vacio    = $('estadoVacio'),
      vTitulo  = $('vacioTitulo'),
      vTexto   = $('vacioTexto'),
      resultado= $('resultado'),
      recHint  = $('recHint'),
      listaRec = $('listaRec'),
      aviso    = $('aviso');

  var centroElegido = '';
  var recientes = [];

  /* ---------------- Aviso ---------------- */
  var tAviso;
  function avisar(txt){
    aviso.textContent = txt;
    aviso.classList.add('ver');
    clearTimeout(tAviso);
    tAviso = setTimeout(function(){ aviso.classList.remove('ver'); }, 2400);
  }

  /* ---------------- Combo centro de costo ---------------- */
  function pintarLista(filtro){
    var f = (filtro || '').trim().toLowerCase();
    var items = CENTROS.filter(function(c){ return c.toLowerCase().indexOf(f) !== -1; });
    ccLista.innerHTML = '';

    if (!items.length){
      var p = document.createElement('p');
      p.className = 'sin-resultado';
      p.textContent = 'Sin coincidencias.';
      ccLista.appendChild(p);
      return;
    }
    items.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role','option');
      b.textContent = c;
      if (c === centroElegido){ b.className = 'marcado'; b.setAttribute('aria-selected','true'); }
      b.addEventListener('click', function(){
        centroElegido = c;
        cc.value = c;
        cerrarLista();
        actualizarVacio();
        avisar('Centro de costo: ' + c);
      });
      ccLista.appendChild(b);
    });
  }

  function abrirLista(){
    pintarLista(cc.value === centroElegido ? '' : cc.value);
    ccLista.hidden = false;
    combo.classList.add('abierto');
    cc.setAttribute('aria-expanded','true');
  }
  function cerrarLista(){
    ccLista.hidden = true;
    combo.classList.remove('abierto');
    cc.setAttribute('aria-expanded','false');
  }

  cc.addEventListener('focus', abrirLista);
  cc.addEventListener('input', function(){
    centroElegido = '';
    actualizarVacio();
    abrirLista();
  });
  ccCaret.addEventListener('click', function(){
    if (ccLista.hidden){ cc.focus(); abrirLista(); } else { cerrarLista(); }
  });
  cc.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ cerrarLista(); }
  });
  document.addEventListener('click', function(e){
    if (!combo.contains(e.target)) cerrarLista();
  });

  /* ---------------- Estado vacío ---------------- */
  function actualizarVacio(){
    if (!resultado.hidden) return;
    if (centroElegido){
      vTitulo.textContent = 'Listo para consultar';
      vTexto.textContent  = 'Ingresa el documento y presiona Buscar.';
    } else {
      vTitulo.textContent = 'Selecciona un centro de costo';
      vTexto.textContent  = 'Elige una opción para continuar.';
    }
  }

  /* ---------------- Búsqueda ---------------- */
  function buscar(){
    var v = doc.value.trim();

    if (!/^[0-9]{8,12}$/.test(v)){
      avisar('Ingresa un documento válido, de 8 a 12 dígitos.');
      doc.focus();
      return;
    }
    if (!centroElegido){
      avisar('Primero selecciona un centro de costo.');
      cc.focus();
      return;
    }

    resultado.innerHTML =
      '<div class="tarjeta">' +
        '<div class="tarjeta-top">' +
          '<div class="avatar-res">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">' +
              '<circle cx="12" cy="8.5" r="3.4"/><path d="M5.2 19.2c1-3.4 3.7-5.2 6.8-5.2s5.8 1.8 6.8 5.2"/>' +
            '</svg>' +
          '</div>' +
          '<div class="quien">' +
            '<b>NOMBRE APELLIDO DE EJEMPLO</b>' +
            '<span>Documento ' + v + ' · ' + centroElegido + '</span>' +
          '</div>' +
          '<span class="chip"><i></i>Sin observaciones</span>' +
        '</div>' +
        '<div class="datos">' +
          '<div><small>Tipo de documento</small><span>DNI</span></div>' +
          '<div><small>Servicio</small><span>Consulta Combo</span></div>' +
          '<div><small>Registros penales</small><span>0 coincidencias</span></div>' +
          '<div><small>Registros policiales</small><span>0 coincidencias</span></div>' +
          '<div><small>Requisitorias</small><span>0 coincidencias</span></div>' +
          '<div><small>Fecha de consulta</small><span>' + fechaHoy() + '</span></div>' +
        '</div>' +
        '<p class="nota-demo">Maqueta de interfaz. Los datos mostrados son de ejemplo, no provienen de una consulta real.</p>' +
      '</div>';

    vacio.hidden = true;
    resultado.hidden = false;
    cuerpo.scrollTop = 0;

    agregarReciente(v, centroElegido);
    avisar('Consulta realizada: ' + v);
  }

  function fechaHoy(){
    var d = new Date();
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
  }
  function horaAhora(){
    var d = new Date();
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function agregarReciente(docNum, centro){
    recientes.unshift({ doc:docNum, centro:centro, hora:horaAhora() });
    if (recientes.length > 6) recientes.pop();

    listaRec.innerHTML = '';
    recientes.forEach(function(r){
      var li = document.createElement('li');
      var b  = document.createElement('b');
      b.textContent = r.doc;
      var s  = document.createElement('span');
      s.className = 'cc';
      s.textContent = r.centro;
      var t  = document.createElement('time');
      t.textContent = r.hora;
      li.appendChild(b); li.appendChild(s); li.appendChild(t);
      listaRec.appendChild(li);
    });
    recHint.hidden  = true;
    listaRec.hidden = false;
  }

  $('btnBuscar').addEventListener('click', buscar);
  doc.addEventListener('keydown', function(e){ if (e.key === 'Enter') buscar(); });
  doc.addEventListener('input', function(){
    if (!resultado.hidden){
      resultado.hidden = true;
      vacio.hidden = false;
      actualizarVacio();
    }
  });

  /* ---------------- Dock y módulos ---------------- */
  var apps      = Array.prototype.slice.call(document.querySelectorAll('.app')),
      ficha     = $('fichaIcono'),
      modTitulo = $('moduloTitulo'),
      modSub    = $('moduloSub'),
      modulo    = $('modulo'),
      escritorio= $('escritorio');

  function abrirModulo(clave){
    var m = MODULOS[clave];
    if (!m) return;

    escritorio.hidden = true;
    modulo.hidden = false;

    modTitulo.textContent = m.titulo;
    modSub.textContent    = m.sub;
    ficha.style.background = 'linear-gradient(160deg, var(' + m.a + '), var(' + m.b + '))';

    apps.forEach(function(a){
      a.setAttribute('aria-current', a.dataset.app === clave ? 'true' : 'false');
    });

    if (clave !== 'prevencion'){
      avisar(m.titulo + ': módulo en construcción.');
    }
  }

  apps.forEach(function(a){
    a.addEventListener('click', function(){ abrirModulo(a.dataset.app); });
  });

  $('btnCerrar').addEventListener('click', function(){
    modulo.hidden = true;
    escritorio.hidden = false;
    apps.forEach(function(a){ a.setAttribute('aria-current','false'); });
  });

  $('btnChat').addEventListener('click', function(){ avisar('Jaina, tu asistente iPartner, te saluda.'); });
  $('btnPerfil').addEventListener('click', function(){ avisar('Menú de perfil.'); });

  /* ---------------- Inicio ---------------- */
  pintarLista('');
  actualizarVacio();
})();
</script>
</body>
